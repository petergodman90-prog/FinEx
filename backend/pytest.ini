[pytest]
asyncio_mode = auto
# One event loop for the whole session: the SQLAlchemy async engine pools
# asyncpg connections, and those connections are bound to the loop they were
# created on (per-test loops on Windows fail with "NoneType has no attribute send").
asyncio_default_fixture_loop_scope = session
asyncio_default_test_loop_scope = session
testpaths = tests
